<title>Bilyard — Hamroh</title>
<style>html,body{margin:0;height:100%;background:#14100c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}canvas{display:block;position:fixed;inset:0}</style></head><body><canvas id="c"></canvas><script>
'use strict';
// ================= HAMROH · BILYARD (rus bilyardi) =================
// O'lchamlar metrda. Stol tik turadi: x — eni, y — bo'yi. "Uy" pastda, piramida tepada.
const W=1.775,H=3.55,R=.034,G=9.8;
const MU_S=.2,MU_R=.011,MU_SP=.044,E_BB=.95,E_C=.76,K_C=.14,MU_BB=.03; // sirpanish, dumalash, aylanish, shar-shar, bort
const DC=.068,MH=.053,DT=1/300;             // burchak luzasi (bort uchidan burchakkacha), o'rta luza yarim eni
const cv=document.getElementById('c'),g=cv.getContext('2d');
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,TAU=Math.PI*2,hyp=Math.hypot;
const store={get(k,d){try{const v=localStorage.getItem('bil_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bil_'+k,JSON.stringify(v))}catch(e){}}};
const haptic=k=>{try{const h=parent.Telegram.WebApp.HapticFeedback;k==='ok'?h.notificationOccurred('success'):k==='err'?h.notificationOccurred('error'):h.impactOccurred(k||'light')}catch(e){}};
// ---------- ovoz ----------
let AC=null,SND=store.get('snd',true);
function audio(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume()}
function click(vol,f=2200,d=.035){if(!SND||!AC||vol<.01)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=AC.createBufferSource(),q=AC.createBiquadFilter(),v=AC.createGain();s.buffer=b;q.type='bandpass';q.frequency.value=f;q.Q.value=1.2;v.gain.value=cl(vol,0,1)*.7;s.connect(q).connect(v).connect(AC.destination);s.start(t)}
function thud(){if(!SND||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(55,t+.22);v.gain.setValueAtTime(.35,t);v.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+.26);click(.3,500,.12)}
// ---------- bortlar: kesmalar (luzalar orasida) va luza og'zi yonoqlari ----------
const RAILS=[];{const a=(x1,y1,x2,y2)=>RAILS.push({x1,y1,x2,y2});const m=H/2,f=.036,o=.044;
 a(DC,0,W-DC,0);a(DC,H,W-DC,H);a(0,DC,0,m-MH);a(0,m+MH,0,H-DC);a(W,DC,W,m-MH);a(W,m+MH,W,H-DC);
 for(const sx of[0,1])for(const sy of[0,1]){const X=sx?W:0,Y=sy?H:0,dx=sx?-1:1,dy=sy?-1:1;a(X+dx*DC,Y,X+dx*(DC-f),Y-dy*o);a(X,Y+dy*DC,X-dx*o,Y+dy*(DC-f))}
 for(const sx of[0,1]){const X=sx?W:0,dx=sx?1:-1;a(X,m-MH,X+dx*o,m-MH+.012);a(X,m+MH,X+dx*o,m+MH-.012)}}
const POCKETS=[[0,0],[W,0],[0,H/2],[W,H/2],[0,H],[W,H]];
// ---------- holat ----------
let balls=[],shot=null,sim=false;
const mk=(x,y,cue)=>({x,y,vx:0,vy:0,wx:0,wy:0,wz:0,on:true,cue:!!cue,pot:0,rx:Math.random()*TAU,ry:Math.random()*TAU});
function rack(){balls=[];const ax=W/2,ay=H/4,d=2*R+.0006;let k=0;for(let row=0;row<5;row++)for(let i=0;i<=row;i++)balls.push(mk(ax+(i-row/2)*d,ay-row*d*.8661,false));balls.push(mk(W/2,H*3/4+.25,true))}
// ---------- fizika ----------
function step(dt){let moving=false;
 for(const b of balls){if(!b.on)continue;const ux=b.vx-R*b.wy,uy=b.vy+R*b.wx,us=hyp(ux,uy),sp=hyp(b.vx,b.vy);
  if(us>1e-4){const a=MU_S*G*dt;if(us<=3.5*a){b.vx-=ux/3.5;b.vy-=uy/3.5;b.wy=b.vx/R;b.wx=-b.vy/R}else{const ex=ux/us,ey=uy/us;b.vx-=a*ex;b.vy-=a*ey;b.wx-=2.5*a/R*ey;b.wy+=2.5*a/R*ex}}
  else if(sp>0){const dec=MU_R*G*dt;if(sp<=dec){b.vx=b.vy=0}else{const k=(sp-dec)/sp;b.vx*=k;b.vy*=k}b.wy=b.vx/R;b.wx=-b.vy/R}
  if(b.wz){const dz=2.5*MU_SP*G/R*dt;b.wz=Math.abs(b.wz)<=dz?0:b.wz-Math.sign(b.wz)*dz}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.rx+=b.vx*dt/R;b.ry+=b.vy*dt/R;
  if(hyp(b.vx,b.vy)>.004||Math.abs(b.wz)>.6||hyp(b.vx-R*b.wy,b.vy+R*b.wx)>.004)moving=true;else{b.vx=b.vy=b.wx=b.wy=b.wz=0}}
 // shar — shar
 for(let i=0;i<balls.length;i++){const a=balls[i];if(!a.on)continue;for(let j=i+1;j<balls.length;j++){const b=balls[j];if(!b.on)continue;const dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)>2*R||Math.abs(dy)>2*R)continue;const d=hyp(dx,dy);if(d>=2*R||d===0)continue;
   const nx=dx/d,ny=dy/d,ov=(2*R-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const rvx=a.vx-b.vx,rvy=a.vy-b.vy,vn=rvx*nx+rvy*ny;if(vn<=0)continue;
   const jn=(1+E_BB)/2*vn;a.vx-=jn*nx;a.vy-=jn*ny;b.vx+=jn*nx;b.vy+=jn*ny;
   const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty-R*(a.wz+b.wz),jt=Math.sign(vt)*Math.min(MU_BB*jn,Math.abs(vt)*.14);a.vx-=jt*tx;a.vy-=jt*ty;b.vx+=jt*tx;b.vy+=jt*ty; // aylanish sharni biroz chetga suradi
   if(shot){if(!shot.first&&(a===shot.ball||b===shot.ball))shot.first=a===shot.ball?b:a;shot.hits++}click(jn*.5,2600);moving=true}}
 // bort
 for(const b of balls){if(!b.on)continue;if(b.x>R+.001&&b.x<W-R-.001&&b.y>R+.001&&b.y<H-R-.001)continue;
  for(const s of RAILS){const ex=s.x2-s.x1,ey=s.y2-s.y1,t=cl(((b.x-s.x1)*ex+(b.y-s.y1)*ey)/(ex*ex+ey*ey)),px=s.x1+ex*t,py=s.y1+ey*t,dx=b.x-px,dy=b.y-py,d=hyp(dx,dy);if(d>=R||d===0)continue;
   const nx=dx/d,ny=dy/d;b.x=px+nx*R;b.y=py+ny*R;const vn=b.vx*nx+b.vy*ny;if(vn>=0)continue;const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty,slip=vt-R*b.wz;
   const vn2=-E_C*vn,vt2=vt-K_C*slip;b.wz+=2.5*K_C*slip/R;b.vx=nx*vn2+tx*vt2;b.vy=ny*vn2+ty*vt2;if(shot){shot.rail++;if(shot.first)shot.railAfter++}click(-vn*.35,900,.05)}
  // luza: chegaradan chiqqan shar tushgan hisoblanadi
  if(b.x<-R*.45||b.x>W+R*.45||b.y<-R*.45||b.y>H+R*.45){b.on=false;b.vx=b.vy=b.wx=b.wy=b.wz=0;b.pot=1;let best=0,bd=9;POCKETS.forEach((p,i)=>{const q=hyp(p[0]-b.x,p[1]-b.y);if(q<bd){bd=q;best=i}});b.pk=best;if(shot)shot.pots.push(b);thud();haptic('medium')}}
 return moving}
// nishon chizig'i: birinchi to'qnashuvgacha
function ray(b,dx,dy){let best=1e9,hit=null;for(const o of balls){if(!o.on||o===b)continue;const ox=o.x-b.x,oy=o.y-b.y,pr=ox*dx+oy*dy;if(pr<=0)continue;const d2=ox*ox+oy*oy-pr*pr;if(d2>=4*R*R)continue;const t=pr-Math.sqrt(4*R*R-d2);if(t<best){best=t;hit=o}}
 let tw=1e9;if(dx>0)tw=Math.min(tw,(W-R-b.x)/dx);if(dx<0)tw=Math.min(tw,(R-b.x)/dx);if(dy>0)tw=Math.min(tw,(H-R-b.y)/dy);if(dy<0)tw=Math.min(tw,(R-b.y)/dy);
 if(tw<best)return{t:tw,hit:null};return{t:best,hit}}
// ---------- o'yin (Amerikanka) ----------
const NEED=8;let ST='menu',turn=0,score=[0,0],debt=[0,0],sel=null,ang=-Math.PI/2,pow=0,spin=[0,0],brk=true,place=false,msg='',msgT=0,winner=-1,MODE='two',spinOpen=false,T=0;
const NAMES=()=>MODE==='solo'?['Siz','—']:['1-o\'yinchi','2-o\'yinchi'];
function say(s,t=2.4){msg=s;msgT=t}
function newGame(mode){MODE=mode;rack();turn=0;score=[0,0];debt=[0,0];brk=true;place=true;winner=-1;sel=balls.find(b=>b.cue);ang=-Math.PI/2;pow=0;spin=[0,0];sim=false;shot=null;ST='play';say('Sharni "uy"da joylang va piramidani buzing',3.5)}
function respot(b){b.on=true;b.pot=0;b.vx=b.vy=b.wx=b.wy=b.wz=0;let x=W/2,y=R+.002,k=0;const free=()=>balls.every(o=>o===b||!o.on||hyp(o.x-x,o.y-y)>2*R+.001);while(!free()&&k<60){k++;x=W/2+((k%2?1:-1)*Math.ceil(k/2))*(2*R+.004);if(x<R+.01||x>W-R-.01){y+=2*R+.004;x=W/2}}b.x=x;b.y=y}
function fire(){if(sim||!sel||pow<.03)return;const V=.5+Math.pow(pow,1.35)*9,dx=Math.cos(ang),dy=Math.sin(ang);sel.vx=dx*V;sel.vy=dy*V;const k=2.5*V/R*.5;sel.wx=-dy*k*spin[1];sel.wy=dx*k*spin[1];sel.wz=-k*spin[0];
 shot={ball:sel,first:null,hits:0,rail:0,railAfter:0,pots:[],brk};sim=true;place=false;click(.4+pow*.6,1500,.05);haptic(pow>.6?'heavy':'light');pow=0}
function endShot(){const s=shot,me=turn,op=1-turn;shot=null;sim=false;let foul='';
 if(!s.first)foul="Shar hech narsaga tegmadi";else if(!s.pots.length&&!s.railAfter&&!s.brk)foul="Urilgandan keyin hech bir shar bortga tegmadi";
 if(foul){for(const b of s.pots)respot(b);if(score[me]>0){score[me]--;const b=balls.find(q=>!q.on&&q.pot===2+me);if(b){respot(b)}}else debt[me]++;say('Jarima: '+foul+'. −1 shar',3.2);haptic('err');turn=MODE==='solo'?0:op}
 else if(s.pots.length){for(const b of s.pots){if(debt[me]>0){debt[me]--;respot(b)}else{b.pot=2+me;score[me]++}}say(s.pots.length>1?s.pots.length+' ta shar tushdi!':'Shar tushdi — yana uring',1.8);haptic('ok')}
 else{turn=MODE==='solo'?0:op;if(MODE!=='solo')say(NAMES()[turn]+' navbati',1.6)}
 brk=false;spin=[0,0];
 if(score[me]>=NEED){winner=me;ST='over';return}
 const left=balls.filter(b=>b.on);if(left.length<2){winner=score[0]>=score[1]?0:1;ST='over';return}
 if(!sel||!sel.on)sel=null;if(!sel){sel=left.find(b=>b.cue)||left[0]}}
// ================= CHIZISH =================
let VW=0,VH=0,DPR=1,S=1,TX0=0,TY0=0,L={};
function fit(){DPR=Math.min(2.5,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';
 const top=74,bot=84,side=14,pw=46,rim=22,aw=VW-side-pw-rim*2-6,ah=VH-top-bot-rim*2;S=Math.min(aw/W,ah/H);TX0=side+rim+(aw-W*S)/2;TY0=top+rim+(ah-H*S)/2;
 L={top,bot,rim,px:TX0+W*S+rim+8,pw:pw-14,py:TY0+30,ph:H*S-60}}
addEventListener('resize',fit);fit();
const X=x=>TX0+x*S,Y=y=>TY0+y*S;
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function txt(s,x,y,sz,col,al='center',wt=700){g.font=wt+' '+sz+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)}
let tableCv=null;
function drawTable(){if(!tableCv||tableCv.width!==cv.width||tableCv.height!==cv.height){tableCv=document.createElement('canvas');tableCv.width=cv.width;tableCv.height=cv.height;const c=tableCv.getContext('2d');c.scale(DPR,DPR);const rim=L.rim,x0=X(0)-rim,y0=Y(0)-rim,w=W*S+rim*2,h=H*S+rim*2;
  c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.roundRect(x0-3,y0+5,w+6,h+6,18);c.fill();
  const wd=c.createLinearGradient(x0,0,x0+w,0);wd.addColorStop(0,'#3a1d0c');wd.addColorStop(.12,'#6b3a1a');wd.addColorStop(.5,'#84491f');wd.addColorStop(.88,'#6b3a1a');wd.addColorStop(1,'#3a1d0c');c.fillStyle=wd;c.beginPath();c.roundRect(x0,y0,w,h,16);c.fill();
  c.strokeStyle='rgba(255,220,160,.18)';c.lineWidth=1;c.beginPath();c.roundRect(x0+3,y0+3,w-6,h-6,13);c.stroke();
  // mato
  const cg=c.createRadialGradient(X(W/2),Y(H/2),10,X(W/2),Y(H/2),H*S*.62);cg.addColorStop(0,'#1f8a52');cg.addColorStop(.7,'#167043');cg.addColorStop(1,'#0e5231');c.fillStyle=cg;c.fillRect(X(0)-8,Y(0)-8,W*S+16,H*S+16);
  // bort rezinasi
  c.fillStyle='#0c4a2c';const cu=7;c.fillRect(X(0)-cu,Y(0)-cu,W*S+cu*2,cu);c.fillRect(X(0)-cu,Y(H),W*S+cu*2,cu);c.fillRect(X(0)-cu,Y(0),cu,H*S);c.fillRect(X(W),Y(0),cu,H*S);
  c.strokeStyle='rgba(255,255,255,.08)';c.lineWidth=1;c.strokeRect(X(0)+.5,Y(0)+.5,W*S-1,H*S-1);
  // luzalar
  for(const[px,py]of POCKETS){const mid=py===H/2,ox=mid?(px?1:-1)*.03:(px?1:-1)*.012,oy=mid?0:(py?1:-1)*.012,rad=(mid?.062:.07)*S;c.fillStyle='#050505';c.beginPath();c.arc(X(px+ox),Y(py+oy),rad,0,TAU);c.fill();c.strokeStyle='#2a1508';c.lineWidth=3;c.stroke();const pg=c.createRadialGradient(X(px+ox),Y(py+oy),rad*.2,X(px+ox),Y(py+oy),rad);pg.addColorStop(0,'rgba(0,0,0,0)');pg.addColorStop(1,'rgba(90,60,30,.35)');c.fillStyle=pg;c.fill()}
  // chiziqlar va nuqtalar
  c.strokeStyle='rgba(255,255,255,.16)';c.lineWidth=1;c.beginPath();c.moveTo(X(0),Y(H*3/4));c.lineTo(X(W),Y(H*3/4));c.stroke();c.fillStyle='rgba(255,255,255,.3)';for(const yy of[H/4,H/2,H*3/4]){c.beginPath();c.arc(X(W/2),Y(yy),2,0,TAU);c.fill()}
  // olmos belgilar
  c.fillStyle='rgba(255,230,180,.55)';for(let i=1;i<8;i++){if(i===4)continue;for(const xx of[x0+rim/2,x0+w-rim/2]){c.beginPath();c.arc(xx,Y(H*i/8),2,0,TAU);c.fill()}}for(let i=1;i<4;i++)for(const yy of[y0+rim/2,y0+h-rim/2]){c.beginPath();c.arc(X(W*i/4),yy,2,0,TAU);c.fill()}}
 g.drawImage(tableCv,0,0,VW,VH)}
function drawBall(b,x,y,r,dim){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x+r*.25,y+r*.35,r*1.02,r*.95,0,0,TAU);g.fill();
 const gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);if(b.cue){gr.addColorStop(0,'#fff0a8');gr.addColorStop(.45,'#e8b62a');gr.addColorStop(1,'#8a5f08')}else{gr.addColorStop(0,'#ffffff');gr.addColorStop(.5,'#ece6d6');gr.addColorStop(1,'#9a927e')}
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
 // dumalashi ko'rinsin: shar sirtidagi kichik belgi
 const mx=Math.sin(b.rx)*Math.cos(b.ry),my=Math.sin(b.ry),mz=Math.cos(b.rx)*Math.cos(b.ry);if(mz>-.2){g.globalAlpha=cl(mz+.2)*.55;g.fillStyle=b.cue?'#7a4a00':'#8b1a1a';g.beginPath();g.arc(x+mx*r*.8,y+my*r*.8,r*.2*(.5+mz*.5),0,TAU);g.fill();g.globalAlpha=1}
 g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.ellipse(x-r*.36,y-r*.42,r*.2,r*.13,-.6,0,TAU);g.fill();if(dim){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}}
function drawAim(){if(sim||!sel||ST!=='play'||place&&false)return;const dx=Math.cos(ang),dy=Math.sin(ang),h=ray(sel,dx,dy),gx=sel.x+dx*h.t,gy=sel.y+dy*h.t,r=R*S;
 g.save();g.beginPath();g.rect(0,L.top-6,VW,VH-L.top-L.bot+10);g.clip();g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.6;g.setLineDash([7,6]);g.beginPath();g.moveTo(X(sel.x+dx*R),Y(sel.y+dy*R));g.lineTo(X(gx),Y(gy));g.stroke();g.setLineDash([]);
 g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=1.5;g.beginPath();g.arc(X(gx),Y(gy),r,0,TAU);g.stroke();
 if(h.hit){const nx=(h.hit.x-gx)/(2*R),ny=(h.hit.y-gy)/(2*R),c=dx*nx+dy*ny,len=.12+.34*c;g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.moveTo(X(h.hit.x),Y(h.hit.y));g.lineTo(X(h.hit.x+nx*len),Y(h.hit.y+ny*len));g.stroke();
  const tx=dx-nx*c,ty=dy-ny*c,tl=hyp(tx,ty);if(tl>.05){const l2=.1+.25*tl;g.strokeStyle='rgba(255,220,120,.7)';g.beginPath();g.moveTo(X(gx),Y(gy));g.lineTo(X(gx+tx/tl*l2),Y(gy+ty/tl*l2));g.stroke()}}
 // kiy
 const back=(R+.02+pow*.32)*S,cl_=1.25*S,cx=X(sel.x)-dx*back,cy=Y(sel.y)-dy*back;g.translate(cx,cy);g.rotate(ang);const cg=g.createLinearGradient(0,-4,0,4);cg.addColorStop(0,'#f3d9a0');cg.addColorStop(.5,'#c9944a');cg.addColorStop(1,'#7a4f1f');g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.moveTo(0,3);g.lineTo(-cl_,8);g.lineTo(-cl_,12);g.lineTo(0,6);g.fill();
 g.fillStyle=cg;g.beginPath();g.moveTo(0,-2.2);g.lineTo(-cl_,-5);g.lineTo(-cl_,5);g.lineTo(0,2.2);g.fill();g.fillStyle='#2a4f9a';g.fillRect(-3,-2.3,3,4.6);g.fillStyle='#f5f0e0';g.fillRect(-9,-2.5,6,5);g.fillStyle='#2a1508';g.fillRect(-cl_,-5,cl_*.3,10);g.restore()}
let btns=[];
function button(x,y,w,h,label,cb,col='#d9a441',tc='#1a1208',sz=17){g.fillStyle='rgba(0,0,0,.35)';rr(x,y+3,w,h,h/2.6);g.fill();g.fillStyle=col;rr(x,y,w,h,h/2.6);g.fill();txt(label,x+w/2,y+h/2+1,sz,tc);btns.push({x,y,w,h,cb})}
function drawHUD(){const nm=NAMES();
 // o'yinchilar va tokchalar
 for(let p=0;p<(MODE==='solo'?1:2);p++){const w=VW/2-18,x=p?VW/2+6:12,y=10,act=turn===p&&ST==='play';g.fillStyle=act?'rgba(217,164,65,.22)':'rgba(255,255,255,.06)';rr(x,y,w,54,12);g.fill();if(act){g.strokeStyle='#d9a441';g.lineWidth=1.5;g.stroke()}
