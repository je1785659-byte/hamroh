<script>
'use strict';
// ================= HAMROH · BILYARD (rus bilyardi) =================
// O'lchamlar metrda. Stol tik turadi: x — eni, y — bo'yi. "Uy" pastda, piramida tepada.
const W=1.775,H=3.55,R=.034,G=9.8;
// O'lchangan qiymatlar (pooltool loyihasi va bilyard fizikasi bo'yicha maqolalardan): mato, shar va bort
let E_C=.95,F_C=.35,E_J=.35,HK=1.15,MU_BB=0;const MU_S=.2,MU_R=.01,SPIN_DEC=2.5*(4/9)*G,E_BB=.95,ST_C=.4,CT_C=Math.sqrt(1-.16); // bort sharga markazidan 0.4R balandda tegadi
const DT=1/300,CW=.05;                       // CW — bort rezinasi eni
// Luza og'zi (bort uchlari orasi): rasmiy o'lcham — burchak 72,5 mm, o'rta 82,5 mm (shar 68 mm). "Keng" rejimda 18% kattaroq.
let PK=1,MC=.0725,MM=.0825;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,TAU=Math.PI*2,hyp=Math.hypot;
const store={get(k,d){try{const v=localStorage.getItem('bil_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bil_'+k,JSON.stringify(v))}catch(e){}}};
const haptic=k=>{if(QUIET)return;try{const h=parent.Telegram.WebApp.HapticFeedback;k==='ok'?h.notificationOccurred('success'):k==='err'?h.notificationOccurred('error'):h.impactOccurred(k||'light')}catch(e){}};
// ---------- ovoz ----------
let AC=null,SND=store.get('snd',true);
let QUIET=false;
// Tovushlar oldindan hisoblab qo'yiladi: har biri tez so'nadigan bir necha ton va juda qisqa shovqin zarbasidan iborat.
// shar-shar: qattiq, jarangdor "chaq"; kiy: yumshoqroq "tok"; bort: bo'g'iq "dup"; luza: tushish va to'r ichida dumalash.
const BUF={};let sndN=0,sndT=0;
function mkBuf(d,fn){const sr=AC.sampleRate,n=Math.floor(sr*d),b=AC.createBuffer(1,n,sr),a=b.getChannelData(0);let lp=0;for(let i=0;i<n;i++){const t=i/sr,nz=Math.random()*2-1;lp+=(nz-lp)*.12;a[i]=fn(t,nz,lp)}let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(a[i]));if(pk>0)for(let i=0;i<n;i++)a[i]*=.9/pk;return b}
function mkSounds(){const s=(f,t,ph=0)=>Math.sin(TAU*f*t+ph),e=(t,k)=>Math.exp(-t/k);
 BUF.clack=mkBuf(.05,(t,nz)=>(s(2250,t)*e(t,.0042)*.55+s(3850,t,.6)*e(t,.0026)*.5+s(6200,t,1.1)*e(t,.0014)*.32+s(1180,t)*e(t,.006)*.22+nz*e(t,.0007)*.6)*Math.min(1,t/.0002));
 BUF.cue=mkBuf(.1,(t,nz,lp)=>(s(880,t)*e(t,.007)*.55+s(1650,t,.4)*e(t,.004)*.3+s(2900,t)*e(t,.0018)*.18+s(170,t)*e(t,.022)*.5+lp*e(t,.003)*1.2)*Math.min(1,t/.0003));

 BUF.pot=mkBuf(.5,(t,nz,lp)=>{let v=(s(120,t)*e(t,.05)*.9+lp*e(t,.02)*1.5)*Math.min(1,t/.001);for(const[t0,a]of[[.07,.5],[.13,.38],[.185,.28],[.235,.2],[.28,.13]])if(t>t0){const u=t-t0;v+=(s(620,u)*e(u,.006)*.5+s(240,u)*e(u,.014)*.7+lp*e(u,.004))*a}return v});
 BUF.tap=mkBuf(.03,(t,nz)=>(s(1900,t)*e(t,.004)*.4+nz*e(t,.001)*.3))}
// Haqiqiy yozuvlar (freesound.org): yuklanguncha yoki yuklanmasa, yuqoridagi hisoblangan tovushlar ishlaydi.
const REC={clack:'ball',cue:'cue',rail:'rail',pot:'pocket',brk:'break'};let muteT=0;
function loadRec(){for(const k in REC)fetch('snd/'+REC[k]+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no))).then(buf=>{BUF[k]=buf}).catch(()=>{})}
function audio(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)();mkSounds();loadRec()}catch(e){}if(AC&&AC.state==='suspended')AC.resume()}
function play(k,vol,rate=1){if(QUIET||!SND||!AC||!BUF[k]||vol<.012)return;const t=AC.currentTime;if(t-sndT>.03){sndT=t;sndN=0}if(++sndN>5)return; // bir lahzada juda ko'p tovush ustma-ust tushmasin
 const src=AC.createBufferSource(),v=AC.createGain();src.buffer=BUF[k];src.playbackRate.value=rate;v.gain.value=Math.min(1,vol);src.connect(v).connect(AC.destination);src.start(t)}
function click(vol,f=2200){if((f===2600||f===800)&&AC&&AC.currentTime<muteT)return;const q=Math.pow(cl(vol),.75);if(f===2600)play('clack',q*.9,.94+Math.random()*.12-q*.05);else if(f===800)play('rail',q*.9,.9+Math.random()*.2);else if(f===1500)play('cue',q,.95+Math.random()*.1);else play('tap',q*.8)}
function thud(){play('pot',.8,.92+Math.random()*.16)}
// ---------- bortlar: kesmalar (luzalar orasida) va luza og'zi yonoqlari ----------
let RAILS=[],HOLES=[];
function buildTable(){const k=PK?1:1.18;MC=.0725*k;MM=.0825*k;RAILS=[];HOLES=[];const a=(x1,y1,x2,y2)=>RAILS.push({x1,y1,x2,y2,j:RAILS.length>5});const m=H/2,d=MC/Math.SQRT2,h=MM/2,f=CW/Math.SQRT2;
 a(d,0,W-d,0);a(d,H,W-d,H);a(0,d,0,m-h);a(0,m+h,0,H-d);a(W,d,W,m-h);a(W,m+h,W,H-d);
 for(const sx of[0,1])for(const sy of[0,1]){const X=sx?W:0,Y=sy?H:0,dx=sx?-1:1,dy=sy?-1:1;a(X+dx*d,Y,X+dx*(d-f),Y-dy*f);a(X,Y+dy*d,X-dx*f,Y+dy*(d-f));HOLES.push({x:X-dx*.0154,y:Y-dy*.0154,r:.046,mx:X+dx*d/2,my:Y+dy*d/2,vr:MC/2+.004,q:[[X+dx*d,Y],[X+dx*(d-f),Y-dy*f],[X-dx*f,Y+dy*(d-f)],[X,Y+dy*d]]})}
 for(const sx of[0,1]){const X=sx?W:0,dx=sx?1:-1;a(X,m-h,X+dx*CW,m-h+.006);a(X,m+h,X+dx*CW,m+h-.006);HOLES.push({x:X+dx*.05,y:m,r:.042,mx:X,my:m,vr:MM/2+.002,q:[[X,m-h],[X+dx*CW,m-h+.006],[X+dx*CW,m+h-.006],[X,m+h]]})}
 tableCv=null}
const POCKETS=[[0,0],[W,0],[0,H/2],[W,H/2],[0,H],[W,H]];let tableCv=null;
// ---------- holat ----------
let balls=[],shot=null,sim=false;
const rnd3=()=>{const a=Math.random()*TAU,z=Math.random()*2-1,q=Math.sqrt(1-z*z);return[Math.cos(a)*q,Math.sin(a)*q,z]};
const mk=(x,y,cue,num)=>{const d=rnd3(),t=rnd3(),k=d[0]*t[0]+d[1]*t[1]+d[2]*t[2];let u=[t[0]-d[0]*k,t[1]-d[1]*k,t[2]-d[2]*k];const l=hyp(u[0],u[1],u[2])||1;u=u.map(q=>q/l);return{x,y,vx:0,vy:0,wx:0,wy:0,wz:0,on:true,cue:!!cue,num:num||0,pot:0,fall:0,d,u}};
// shar ustidagi raqam haqiqiy aylanish bo'yicha buriladi
function spinMark(b,dt){const wx=b.wx,wy=b.wy,wz=b.wz;for(const v of[b.d,b.u]){const x=v[0],y=v[1],z=v[2];v[0]+=(wy*z-wz*y)*dt;v[1]+=(wz*x-wx*z)*dt;v[2]+=(wx*y-wy*x)*dt}const d=b.d,u=b.u;let l=hyp(d[0],d[1],d[2]);d[0]/=l;d[1]/=l;d[2]/=l;const k=d[0]*u[0]+d[1]*u[1]+d[2]*u[2];u[0]-=d[0]*k;u[1]-=d[1]*k;u[2]-=d[2]*k;l=hyp(u[0],u[1],u[2])||1;u[0]/=l;u[1]/=l;u[2]/=l}
let JIT=.0002; // haqiqiy piramida ideal zich turmaydi: sharlar orasida mayda tirqishlar bor
function rack(rnd=Math.random){balls=[];const ax=W/2,ay=H/4,d=2*R+JIT;let k=0;for(let row=0;row<5;row++)for(let i=0;i<=row;i++)balls.push(mk(ax+(i-row/2)*d+(rnd()-.5)*JIT,ay-row*d*.8661+(rnd()-.5)*JIT,false,++k));balls.push(mk(W/2,H*3/4+.25,true))}
// ---------- fizika ----------
// Tez sharlar bir qadamda bir-birining ichiga kirib ketmasligi uchun qadam maydalanadi (bir bo'lakda ko'pi bilan 4 mm yo'l).
function step(dt){let vm=0;for(const b of balls)if(b.on){const v=Math.abs(b.vx)+Math.abs(b.vy);if(v>vm)vm=v}const k=Math.min(14,Math.max(1,Math.ceil(vm*dt/.004)));let mv=false;for(let i=0;i<k;i++)mv=sub(dt/k);return mv}
function sub(dt){let moving=false;
 for(const b of balls){if(!b.on)continue;const ux=b.vx-R*b.wy,uy=b.vy+R*b.wx,us=hyp(ux,uy),sp=hyp(b.vx,b.vy);
  if(us>1e-4){const a=MU_S*G*dt;if(us<=3.5*a){b.vx-=ux/3.5;b.vy-=uy/3.5;b.wy=b.vx/R;b.wx=-b.vy/R}else{const ex=ux/us,ey=uy/us;b.vx-=a*ex;b.vy-=a*ey;b.wx-=2.5*a/R*ey;b.wy+=2.5*a/R*ex}}
  else if(sp>0){const dec=MU_R*G*dt;if(sp<=dec){b.vx=b.vy=0}else{const k=(sp-dec)/sp;b.vx*=k;b.vy*=k}b.wy=b.vx/R;b.wx=-b.vy/R}
  if(b.wz){const dz=SPIN_DEC*dt;b.wz=Math.abs(b.wz)<=dz?0:b.wz-Math.sign(b.wz)*dz}
  b.x+=b.vx*dt;b.y+=b.vy*dt;if(!QUIET)spinMark(b,dt);
  if(hyp(b.vx,b.vy)>.004||hyp(b.vx-R*b.wy,b.vy+R*b.wx)>.004)moving=true;else{b.vx=b.vy=b.wx=b.wy=b.wz=0}/* joyida aylanayotgan (yon aylanish) shar endi kutilmaydi: u hech narsani qimirlatmaydi */}
 // shar — shar
 for(let it=0,any=true;it<5&&any;it++){any=false;for(let i=0;i<balls.length;i++){const a=balls[i];if(!a.on)continue;for(let j=i+1;j<balls.length;j++){const b=balls[j];if(!b.on)continue;const dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)>2*R||Math.abs(dy)>2*R)continue;const d=hyp(dx,dy);if(d>=2*R||d===0)continue;
   const rvx=a.vx-b.vx,rvy=a.vy-b.vy;let nx=dx/d,ny=dy/d;const A=rvx*rvx+rvy*rvy,Bq=dx*rvx+dy*rvy;if(Bq>0&&A>1e-9){const tau=Math.min(dt*1.5,(-Bq+Math.sqrt(Bq*Bq-A*(d*d-4*R*R)))/A),ex=dx+rvx*tau,ey=dy+rvy*tau,el=hyp(ex,ey)||1;nx=ex/el;ny=ey/el} // tegish lahzasidagi yo'nalish
   const ov=(2*R-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const vn=rvx*nx+rvy*ny;if(vn<=0)continue;
   const jn=(1+E_BB)/2*vn;a.vx-=jn*nx;a.vy-=jn*ny;b.vx+=jn*nx;b.vy+=jn*ny;
   const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty-R*(a.wz+b.wz),jt=Math.sign(vt)*Math.min(MU_BB*jn,Math.abs(vt)*.14);a.vx-=jt*tx;a.vy-=jt*ty;b.vx+=jt*tx;b.vy+=jt*ty; // aylanish sharni biroz chetga suradi
   if(shot){if(!shot.first&&(a===shot.ball||b===shot.ball))shot.first=a===shot.ball?b:a;shot.hits++}click(jn*.22,2600);moving=true;any=true}}}
 // bort va luza yonoqlari: bort sharga markazidan balandroqda tegadi, shuning uchun aylanish va tezlik birga o'zgaradi
 for(const b of balls){if(!b.on)continue;if(b.x>R+.001&&b.x<W-R-.001&&b.y>R+.001&&b.y<H-R-.001)continue;
  for(const s of RAILS){const ex=s.x2-s.x1,ey=s.y2-s.y1,t=cl(((b.x-s.x1)*ex+(b.y-s.y1)*ey)/(ex*ex+ey*ey)),px=s.x1+ex*t,py=s.y1+ey*t,dx=b.x-px,dy=b.y-py,d=hyp(dx,dy);if(d>=R||d===0)continue;
   const nx=dx/d,ny=dy/d;b.x=px+nx*R;b.y=py+ny*R;const ax=-nx,ay=-ny,bx=-ay,by=ax;let vx=b.vx*ax+b.vy*ay;if(vx<=0)continue;let vy=b.vx*bx+b.vy*by,wx=b.wx*ax+b.wy*ay,wy=b.wx*bx+b.wy*by;
   const jaw=s.j||t<=0||t>=1,sx=vx*ST_C+R*wy,sy=-vy-R*b.wz*CT_C+R*wx*ST_C,sl=hyp(sx,sy),pn=(1+(jaw?E_J:E_C))*vx*CT_C;let fx,fy;if(sl/3.5<=F_C*pn){fx=sx/3.5;fy=sy/3.5}else{fx=F_C*pn*sx/sl;fy=F_C*pn*sy/sl}
   const PX=-fx*ST_C-pn*CT_C,PY=fy,PZ=fx*CT_C-pn*ST_C,v0=vx;vx+=PX;vy+=PY;wx-=2.5/R*PY*ST_C;wy+=2.5/R*(PX*ST_C-PZ*CT_C);b.wz+=2.5/R*PY*CT_C;
   b.vx=vx*ax+vy*bx;b.vy=vx*ay+vy*by;b.wx=wx*ax+wy*bx;b.wy=wx*ay+wy*by;if(shot){shot.rail++;if(shot.first)shot.railAfter++}click(v0*.2,800);moving=true}
  // luza: shar markazi teshik ustiga o'tsa, pastga tushadi
  let hole=null;for(const h of HOLES)if(hyp(b.x-h.x,b.y-h.y)<h.r*HK){hole=h;break}if(!hole&&(b.x<-.09||b.x>W+.09||b.y<-.09||b.y>H+.09))hole=HOLES.reduce((p,h)=>hyp(b.x-h.x,b.y-h.y)<hyp(b.x-p.x,b.y-p.y)?h:p);
  if(hole){b.on=false;b.fvx=b.vx;b.fvy=b.vy;b.vx=b.vy=b.wx=b.wy=b.wz=0;b.pot=1;b.fall=.001;b.ft=0;b.hole=hole;if(shot)shot.pots.push(b);thud();haptic('medium')}}
 return moving}
// nishon chizig'i: birinchi to'qnashuvgacha
function ray(b,dx,dy){let best=1e9,hit=null;for(const o of balls){if(!o.on||o===b)continue;const ox=o.x-b.x,oy=o.y-b.y,pr=ox*dx+oy*dy;if(pr<=0)continue;const d2=ox*ox+oy*oy-pr*pr;if(d2>=4*R*R)continue;const t=pr-Math.sqrt(4*R*R-d2);if(t<best){best=t;hit=o}}
 let tw=1e9;if(dx>0)tw=Math.min(tw,(W-R-b.x)/dx);if(dx<0)tw=Math.min(tw,(R-b.x)/dx);if(dy>0)tw=Math.min(tw,(H-R-b.y)/dy);if(dy<0)tw=Math.min(tw,(R-b.y)/dy);
 if(tw<best)return{t:tw,hit:null};return{t:best,hit}}
// ---------- o'yin: Amerikanka ('am') va Moskva piramidasi ('ms') ----------
const NEED=8;let VAR=store.get('var','am'),pick=false,ST='menu',turn=0,score=[0,0],debt=[0,0],sel=null,ang=-Math.PI/2,pow=0,spin=[0,0],brk=true,place=false,msg='',msgT=0,winner=-1,MODE='two',spinOpen=false,T=0;
let LVL=store.get('lvl',1),AIM=store.get('aim',1),AIMG=1; // AIM — menyuda tanlangan mo'ljal turi; AIMG — joriy o'yinniki (onlaynda xona ochganniki)
const LVN=['Oson',"O'rta",'Kuchli'];
const NAMES=()=>MODE==='net'?[0,1].map(i=>i===NB.you?'Siz':(NB.names[i]||'Raqib')):MODE==='solo'?['Siz','—']:MODE==='ai'?['Siz',CUP.on?CUP.r.n:'Kompyuter']:['1-o\'yinchi','2-o\'yinchi'];
function say(s,t=2.4){msg=s;msgT=t}
function newGame(mode,o){ERR=null;MODE=mode;AIMG=mode==='net'?NB.aim:AIM;rack(o&&o.rnd);turn=o&&o.first||0;NB.pend=null;score=[0,0];debt=[0,0];brk=true;place=true;pick=false;winner=-1;sel=balls.find(b=>b.cue);ang=-Math.PI/2;pow=0;spin=[0,0];sim=false;shot=null;ST='play';AI=null;say(MODE==='net'&&turn!==NB.you?'Raqib piramidani buzadi':'Sharni "uy"da joylang va piramidani buzing',3.5)}
function respot(b){b.on=true;b.pot=0;b.fall=0;b.vx=b.vy=b.wx=b.wy=b.wz=0;let x=W/2,y=R+.002,k=0;const free=()=>balls.every(o=>o===b||!o.on||hyp(o.x-x,o.y-y)>2*R+.001);while(!free()&&k<60){k++;x=W/2+((k%2?1:-1)*Math.ceil(k/2))*(2*R+.004);if(x<R+.01||x>W-R-.01){y+=2*R+.004;x=W/2}}b.x=x;b.y=y}
function strike(b,a,p,sp){const V=.4+Math.pow(p,1.35)*10.6,dx=Math.cos(a),dy=Math.sin(a),k=2.5*V/R*.5;b.vx=dx*V;b.vy=dy*V;b.wx=-dy*k*sp[1];b.wy=dx*k*sp[1];b.wz=-k*sp[0]}
function fire(){if(pick){pow=0;return}if(sim||!sel||pow<.03){pow=0;return}lastPow=pow;if(MODE==='learn'&&LS.ph==='try')LS.pl={a:ang,p:pow,s:spin.slice()};if(MODE==='net'&&!NB.pend)NB.sh={i:balls.indexOf(sel),a:ang,p:pow,s:spin.slice(),x:sel.x,y:sel.y};strike(sel,ang,pow,spin);
 cueFx={x:sel.x,y:sel.y,a:ang,p:pow,t:0};shot={ball:sel,first:null,hits:0,rail:0,railAfter:0,pots:[],brk,home:place&&!brk};sim=true;place=false;(brk&&pow>.55&&BUF.brk&&!QUIET&&SND&&AC?(play('brk',.6+pow*.4),muteT=AC.currentTime+1.4,play('cue',.5)):click(.4+pow*.6,1500,.05));haptic(pow>.6?'heavy':'light');pow=0}
function cueHome(){const c=balls.find(b=>b.cue);c.on=true;c.pot=0;c.fall=0;c.vx=c.vy=c.wx=c.wy=c.wz=0;c.x=W/2;c.y=H*3/4+.25;let k=0;while(balls.some(o=>o!==c&&o.on&&hyp(o.x-c.x,o.y-c.y)<2*R+.002)&&k++<40)c.x=W/2+((k%2?1:-1)*Math.ceil(k/2))*(2*R+.01);place=true;sel=c}
function win(me){winner=me;ST='over';haptic('ok')}
function endMs(){const s=shot,me=turn,op=1-turn,cue=balls.find(b=>b.cue),cuePot=s.pots.includes(cue),obj=s.pots.filter(b=>b!==cue);shot=null;sim=false;let foul='';
 const inHome=b=>b.y>H*3/4,others=balls.filter(b=>b.on&&!b.cue||s.pots.includes(b)&&!b.cue);
 if(!s.first)foul="Sariq shar hech narsaga tegmadi";else if(s.home&&inHome(s.first)&&others.some(b=>!inHome(b)))foul="Uydan urganda avval uydan tashqaridagi sharga tegish kerak";else if(!s.pots.length&&!s.railAfter&&!s.brk)foul="Urilgandan keyin hech bir shar bortga tegmadi";
 brk=false;spin=[0,0];
 if(foul){for(const b of obj)respot(b);if(score[me]>0){score[me]--;const b=balls.find(q=>!q.on&&q.pot===2+me);if(b)respot(b)}else debt[me]++;say('Jarima: '+foul+'. −1 shar',3.2);haptic('err');turn=MODE==='solo'?0:op;if(cuePot)cueHome()}
 else if(s.pots.length){for(const b of obj){if(debt[me]>0){debt[me]--;respot(b)}else{b.pot=2+me;score[me]++}}
