function wrap(s,x,y,size,col,maxw,lh){g.font=`600 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=col;const ws=s.split(' ');let l='',ls=[];for(const w of ws){if(g.measureText(l+w).width>maxw&&l){ls.push(l.trim());l=''}l+=w+' '}ls.push(l.trim());ls.forEach((q,i)=>g.fillText(q,x,y+(i-(ls.length-1)/2)*lh))}

function pickLane(wt){let L=LV[LI].lanes.filter(r=>isWater(r)===!!wt);if(!L.length)L=LV[LI].lanes;if(L.length===1)return L[0];let best=null,bw=-1;for(const r of L){let w=1+R();const k=lastLane.lastIndexOf(r);if(k>=0)w*=cl((lastLane.length-k)/L.length,.15,1);if(w>bw){bw=w;best=r}}lastLane.push(best);if(lastLane.length>8)lastLane.shift();return best}
function spawnZ(type,x,row){const d=Z[type];const z={type,sub:type==='dive',row:row==null?pickLane(d.water):row,x:x==null?LW+rnd(10,50):x,hp:d.hp,max:d.hp,arm:d.arm,armMax:d.arm,sp:CW/d.sp*rnd(.94,1.06),slow:0,eat:null,biteT:0,dead:0,ph:R()*10,wid:waveId,pole:type==='pole',jump:0,jx0:0,jx1:0,flash:0,butter:0};zombies.push(z);return z}
function spawnWave(){wave++;waveId++;const L=LV[LI];const isFlag=flagAt.includes(wave),isFinal=wave===waves;
 let pts=Math.floor(wave/3)+1+(LI>=10?1:0);if(isFlag)pts=Math.floor(pts*2.5);if(L.mode==='bowl')pts=Math.ceil(pts*1.6);if(LI===0)pts=wave<3?1:2;
 const list=[];if(isFlag){list.push('flag');pts=Math.max(1,pts-1)}
 const allow=L.zs.filter(t=>t!=='basic');let guard=0;
 while(pts>0&&guard++<60){const cand=['basic'];for(const t of allow){if(Z[t].cost<=pts&&(wave>=(t==='pot'?4:t==='pole'?2:3)||isFlag))cand.push(t)}
  let tot=0;const ws=cand.map(t=>{const w=t==='basic'?Math.max(400,4000-wave*180):Z[t].w;tot+=w;return w});let q=R()*tot,pick='basic';for(let k=0;k<cand.length;k++){q-=ws[k];if(q<=0){pick=cand[k];break}}
  list.push(pick);pts-=Z[pick].cost}
 // yangi zombi birinchi marta — albatta ko'rsatiladi
 const nz=L.zs[L.zs.length-1];if(nz!=='basic'&&wave===(nz==='pot'?4:3)&&!list.includes(nz))list[list.length-1]=nz;
 waveHP0=0;list.forEach((t,k)=>{const z=spawnZ(t,LW+rnd(8,40)+(isFlag?k*rnd(14,30):k*rnd(18,40)));waveHP0+=z.hp+z.arm});
 waveT=0;nextIn=rnd(25,31);if(isFinal){spawnedAll=true;finalMsg=2.6;finalShown=true}
 if(wave>=waves)spawnedAll=true}
function waveHP(){let s=0;for(const z of zombies)if(z.wid===waveId&&!z.dead)s+=z.hp+z.arm;return s}

function hurt(z,dmg,pierce){if(z.dead)return;z.flash=.1;if(!pierce&&z.arm>0){const a=Math.min(z.arm,dmg);z.arm-=a;dmg-=a;SFX.clank();if(z.arm<=0)fx.push({k:'hat',x:z.x,y:rowY(z.row)-78,vx:rnd(30,70),vy:-160,t:0,type:z.type,rot:0})}else SFX.hit();
 if(pierce){z.arm=0}z.hp-=dmg;if(z.hp<=0)kill(z)}
function kill(z,silent){if(z.dead)return;z.dead=.001;z.eat=null;if(spawnedAll&&!rewardDrop&&zombies.every(q=>q.dead)){rewardDrop={x:cl(z.x,GX+40,LW-80),y:rowY(z.row)-30,t:0,got:false}}}
function explode(cx,cy,row,rad){SFX.boom();haptic('heavy');fx.push({k:'boom',x:cx,y:cy,t:0,r:rad});for(const z of zombies){if(z.dead)continue;if(Math.abs(z.row-row)<=1&&Math.abs(z.x-cx)<=rad){z.arm=0;z.hp-=1800;if(z.hp<=0){z.dead=.001;z.eat=null;z.ash=true}}}
 if(spawnedAll&&!rewardDrop&&zombies.every(q=>q.dead))rewardDrop={x:cl(cx,GX+40,LW-80),y:cy,t:0,got:false}}

function canPlant(type,r,c){if(r<0||r>=ROWS||c<0||c>=COLS||!laneOpen(r)||plants[r][c])return false;const w=isWater(r);if(type==='raft'||type==='whirl')return w&&!rafts[r][c];if(w)return !!rafts[r][c]&&type!=='mine';if(LV[LI].mode==='bowl'&&c>2)return false;return true}
function plantAt(type,r,c){const d=P[type];if(type==='raft'){rafts[r][c]={t:'raft',hp:d.hp,max:d.hp,r,c,age:0};SFX.splash();haptic('light');fx.push({k:'drop',x:cellX(c),y:rowY(r)-14,t:0});return}
 const p={t:type,hp:d.hp,max:d.hp,r,c,age:0,tm:0,ph:R()*10,shoot:0,st:0};
 if(type==='sun')p.tm=rnd(3,12.5);if(type==='pea'||type==='ice'||type==='twin'||type==='tri')p.tm=rnd(.2,1.4);if(type==='bomb')p.tm=1.2;if(type==='mine')p.tm=15;
 if(LV[LI].mode==='bowl'&&(type==='nut'||type==='xnut')){nuts.push({x:cellX(c),y:rowY(r)-28,row:r,vx:300,vy:0,x2:type==='xnut',last:null,rot:0});SFX.roll();return}
 plants[r][c]=p;SFX.plant();haptic('light');fx.push({k:'dirt',x:cellX(c),y:rowY(r),t:0})}

  else if(p.t==='pea'||p.t==='ice'||p.t==='twin'){p.tm-=dt;if(p.tm<=0){if(zombies.some(z=>!z.dead&&!z.sub&&z.row===r&&z.x>px-10&&z.x<LW+10&&z.jump===0)){p.tm=rnd(1.36,1.5);p.shoot=.18;shots.push({row:r,x:px+26,y:py-46,ice:p.t==='ice'});if(p.t==='twin')p.q=.16;SFX.shoot()}else p.tm=.15}

  else if(p.t==='tri'){p.tm-=dt;if(p.tm<=0){const rs=[r-1,r,r+1].filter(q=>q>=0&&q<ROWS&&laneOpen(q));if(zombies.some(z=>!z.dead&&!z.sub&&rs.includes(z.row)&&z.x>px-10&&z.x<LW+10&&z.jump===0)){p.tm=rnd(1.36,1.5);p.shoot=.18;for(const q of rs)shots.push({row:q,x:px+26,y:rowY(q)-46,ice:false,tut:true});SFX.shoot()}else p.tm=.15}}
  else if(p.t==='jump'){if(p.st===0){const z=zombies.filter(z=>!z.dead&&!z.sub&&z.row===r&&z.jump===0&&z.x>px-52&&z.x<px+CW*1.25).sort((a,b)=>a.x-b.x)[0];if(z){p.st=1;p.tm=.55;p.tx=z.x;p.vic=z;SFX.pop()}}
   else{p.tm-=dt;if(p.vic&&!p.vic.dead)p.tx=p.vic.x;if(p.tm<=0){plants[r][c]=null;SFX.boom();haptic('heavy');fx.push({k:'dirt',x:p.tx,y:py,t:0});fx.push({k:'boom',x:p.tx,y:py-20,t:0,r:46,small:true});for(const z of zombies)if(!z.dead&&z.row===r&&z.jump===0&&Math.abs(z.x-p.tx)<50){z.arm=0;z.hp-=1800;if(z.hp<=0)kill(z)}}}}
  else if(p.t==='whirl'){if(p.st===0){const z=zombies.filter(z=>!z.dead&&z.row===r&&z.x>px-24&&z.x<px+CW*1.05).sort((a,b)=>a.x-b.x)[0];if(z){p.st=1;p.tm=.6;p.vic=z;z.pull=p;z.eat=null;SFX.splash()}}
   else{p.tm-=dt;const z=p.vic;if(z&&!z.dead)z.x=lerp(z.x,px,cl(dt*7));if(p.tm<=0){plants[r][c]=null;fx.push({k:'drop',x:px,y:py-14,t:0});if(z&&!z.dead){z.gone=true;SFX.gulp();haptic('medium');kill(z)}}}}
  else if(p.t==='bomb'){p.tm-=dt;if(p.tm<=0){plants[r][c]=null;explode(px,py-30,r,CW*1.55)}}
  else if(p.t==='mine'){if(p.tm>0){p.tm-=dt;if(p.tm<=0){SFX.pop();fx.push({k:'dirt',x:px,y:py,t:0})}}else{if(zombies.some(z=>!z.dead&&z.row===r&&z.jump===0&&Math.abs(z.x-px)<38)){plants[r][c]=null;SFX.boom();haptic('heavy');fx.push({k:'boom',x:px,y:py-20,t:0,r:70,small:true});for(const z of zombies)if(!z.dead&&z.row===r&&z.x>px-55&&z.x<px+85){z.arm=0;z.hp-=1800;if(z.hp<=0){z.dead=.001;z.eat=null;z.ash=true}}
     if(spawnedAll&&!rewardDrop&&zombies.every(q=>q.dead))rewardDrop={x:px,y:py-30,t:0,got:false}}}}
  else if(p.t==='snap'){if(p.st===0){const z=zombies.filter(z=>!z.dead&&!z.sub&&z.row===r&&z.jump===0&&z.x>px-20&&z.x<px+CW*1.45).sort((a,b)=>a.x-b.x)[0];if(z){p.st=1;p.tm=.42;p.vic=z}}
   else if(p.st===1){p.tm-=dt;if(p.tm<=0){const z=p.vic;if(z&&!z.dead&&z.row===r&&z.x<px+CW*1.7){z.dead=1;z.gone=true;z.eat=null;SFX.gulp();haptic('medium');p.st=2;p.tm=42;if(spawnedAll&&!rewardDrop&&zombies.every(q=>q.dead))rewardDrop={x:px+40,y:py-30,t:0,got:false}}else p.st=0;p.vic=null}}
   else{p.tm-=dt;if(p.tm<=0)p.st=0}}
 }
 // o'qlar
 for(const s of shots){s.x+=340*dt;const z=zombies.filter(z=>!z.dead&&!z.sub&&z.row===s.row&&z.jump===0&&s.x>=z.x-16&&s.x<=z.x+26)[0];if(z){s.hit=true;hurt(z,20);if(s.ice)z.slow=10;fx.push({k:'splat',x:s.x,y:s.y,t:0,ice:s.ice})}}
 shots=shots.filter(s=>!s.hit&&s.x<LW+20);
 // dumalovchi yong'oqlar
 for(const n of nuts){n.x+=n.vx*dt;n.y+=n.vy*dt;n.rot+=dt*9;const top=rowY(0)-28,bot=rowY(ROWS-1)-28;if(n.y<top){n.y=top;n.vy=Math.abs(n.vy)}if(n.y>bot){n.y=bot;n.vy=-Math.abs(n.vy)}
  for(const z of zombies){if(z.dead||z===n.last)continue;const zy=rowY(z.row)-28;if(Math.abs(z.x-n.x)<34&&Math.abs(zy-n.y)<36){if(n.x2){n.done=true;explode(n.x,n.y,z.row,CW*1.55);break}
    if(z.arm>0){z.arm=Math.max(0,z.arm-900);SFX.clank();if(z.arm<=0)fx.push({k:'hat',x:z.x,y:zy-50,vx:rnd(30,70),vy:-160,t:0,type:z.type,rot:0})}else{z.hp-=1800;if(z.hp<=0)kill(z)}
    SFX.hit();haptic('light');n.last=z;const sp=230;n.vy=n.vy===0?(zy<=top+5?sp:zy>=bot-5?-sp:(R()<.5?sp:-sp)):-n.vy;break}}}

 // zombilar

  if(z.pull){if(plants[z.pull.r][z.pull.c]===z.pull)continue;z.pull=null}

  // o'simlik bilan to'qnashuv
  let tgt=null;const c=Math.floor((z.x-28-GX)/CW);if(c>=0&&c<COLS){const p=plants[z.row][c]||rafts[z.row][c];if(p&&!((p.t==='jump'||p.t==='whirl')&&p.st===1)&&!(p.t==='mine'&&p.tm<=0)&&!(p.t==='bomb')){const px=cellX(c);if(z.x-28<px+26&&z.x>px-20)tgt=p}}
  if(z.type==='dive')z.sub=!tgt;
  if(tgt&&z.pole){z.jump=.001;z.jx0=z.x;z.jx1=cellX(tgt.c)-CW*.62;z.eat=null;continue}
  if(tgt){z.eat=tgt;z.biteT-=dt*k;if(z.biteT<=0){z.biteT=.5;tgt.hp-=50;tgt.bit=.15;SFX.bite();if(tgt.hp<=0){if(tgt.t==='raft'){rafts[tgt.r][tgt.c]=null;fx.push({k:'drop',x:cellX(tgt.c),y:rowY(tgt.r)-14,t:0})}else plants[tgt.r][tgt.c]=null;z.eat=null}}}
  else{z.eat=null;z.x-=z.sp*(z.pole?1:1)*k*dt}
  // maysa o'rgich / uy
  const m=mowers[z.row];if(m&&!m.gone&&!m.on&&z.x<m.x+34){m.on=true;SFX.mower();haptic('medium')}

 }
 for(let r=0;r<ROWS;r++){const m=mowers[r];if(m&&m.on&&!m.gone){m.x+=430*dt;for(const z of zombies)if(!z.dead&&z.row===r&&Math.abs(z.x-m.x)<40){z.arm=0;z.hp=0;kill(z)}if(m.x>LW+60)m.gone=true}}
 zombies=zombies.filter(z=>!(z.dead>1.2));
 for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<(f.k==='boom'?.7:f.k==='hat'?1.2:f.k==='drop'?.6:.45));
 // mukofot
 if(spawnedAll&&!rewardDrop&&zombies.length===0&&hugeMsg<=0)rewardDrop={x:LW/2,y:LH/2,t:0,got:false};
 if(rewardDrop){rewardDrop.t+=dt;if(!rewardDrop.got&&rewardDrop.t>6)collectReward()}

 tipT+=dt;
}

 if(ST==='won'){g.fillStyle='rgba(255,250,220,.9)';g.fillRect(0,0,LW,LH);btns=[];const rw=LV[LI].reward;for(let i=0;i<16;i++){g.save();g.translate(LW/2,210);g.rotate(i/16*TAU+T*.3);g.fillStyle=i%2?'rgba(255,200,40,.35)':'rgba(255,230,120,.25)';g.beginPath();g.moveTo(0,0);g.lineTo(-60,-520);g.lineTo(60,-520);g.fill();g.restore()}

function hitBtn(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b}return null}
let dragging=false,downAt=null;
function trySun(x,y){let best=null,bd=46;for(const s of suns){if(s.st>1)continue;const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;best=s}}if(best){best.st=2;best.u=0;best.x0=best.x;best.y0=best.y;SFX.sun();haptic('light');return true}return false}
function tryCell(x,y){const c=Math.floor((x-GX)/CW),r=Math.floor((y-GY)/CH);if(r<0||r>=ROWS||c<0||c>=COLS)return false;
 if(shovel){if(plants[r][c]){plants[r][c]=null;SFX.plant();fx.push({k:isWater(r)?'drop':'dirt',x:cellX(c),y:rowY(r)-(isWater(r)?14:0),t:0})}else if(rafts[r][c]){rafts[r][c]=null;SFX.splash();fx.push({k:'drop',x:cellX(c),y:rowY(r)-14,t:0})}shovel=false;return true}
 const t=selType();if(!t)return false;if(!canPlant(t,r,c)){SFX.no();return true}
 if(LV[LI].mode){belt.splice(sel,1);plantAt(t,r,c);sel=null}else{if(sunN<P[t].cost||cdT[t]>0){SFX.no();sel=null;return true}sunN-=P[t].cost;cdT[t]=P[t].cd;plantAt(t,r,c);sel=null}return true}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=toL(e);PT=[x,y];downAt=[x,y];
 if(ST==='play'){const b=hitBtn(x,y);if(b){if(b.reward){collectReward();return}if(b.pause){ST='paused';SFX.tap();return}if(b.shovel){shovel=!shovel;sel=null;SFX.tap();return}
   if(b.seed){if(sel===b.seed){sel=null}else if(cdT[b.seed]>0||sunN<P[b.seed].cost){SFX.no();sel=null}else{sel=b.seed;shovel=false;dragging=true;SFX.tap()}return}
   if(b.belt!=null){sel=sel===b.belt?null:b.belt;dragging=sel!=null;SFX.tap();return}}
  if(trySun(x,y))return;if(sel!=null||shovel){tryCell(x,y)}return}
 const b=hitBtn(x,y);if(b&&b.cb){SFX.tap();b.cb()}});
cv.addEventListener('pointermove',e=>{const[x,y]=toL(e);PT=[x,y];if(ST==='play'&&e.buttons)trySun(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=toL(e);if(ST==='play'&&dragging&&downAt&&Math.hypot(x-downAt[0],y-downAt[1])>30&&y>GY)tryCell(x,y);dragging=false});
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key===' '){if(ST==='play')ST='paused';else if(ST==='paused')ST='play'}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ST==='play')ST='paused'});

let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;let n=0;while(acc>=1/60&&n++<6){update(1/60);acc-=1/60}if(ST==='menu'||ST==='levels'||ST==='choose'||ST==='won')T+=0;render();requestAnimationFrame(frame)}
function render(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#10160f';g.fillRect(0,0,cv.width,cv.height);
 if(ROT){g.setTransform(0,DPR,-DPR,0,cv.width,0)}else g.setTransform(DPR,0,0,DPR,0,0);g.translate(OX,OY);g.scale(SC,SC);g.save();g.beginPath();g.rect(0,0,LW,LH);g.clip();
 if(ST==='menu'){T+=1/60;drawMenu()}else if(ST==='levels'){T+=1/60;drawLevels()}else if(ST==='choose'){T+=1/60;drawChoose()}else{if(ST==='won'||ST==='paused')T+=ST==='won'?1/60:0;drawPlay();drawOverlay()}
 g.restore()}
